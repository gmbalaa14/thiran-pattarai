name: Skill or plugin request
description: Suggest a new skill, a new plugin, or an improvement to an existing skill.
title: "[Skill]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. If you would like to build it yourself, see [CONTRIBUTING.md](https://github.com/gmbalaa14/thiran-pattarai/blob/main/CONTRIBUTING.md) and open a pull request.
  - type: dropdown
    id: kind
    attributes:
      label: What are you proposing?
      options:
        - A new skill in the thiran plugin
        - A new plugin (for example thiran-devops)
        - An improvement to an existing skill
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Suggested name
      description: Lowercase and hyphenated, for example `release-notes`. For an existing skill, give its name.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the task you do today and where it hurts.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: How should it work?
      description: What you would type, what Claude should ask or do, and what you get back.
      placeholder: |
        /thiran:release-notes
        -> reads merged PRs since the last tag
        -> writes a grouped changelog
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other skills, plugins or workflows you tried.
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some guidance"
        - "No, I am suggesting it"
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/gmbalaa14/thiran-pattarai/blob/main/CODE_OF_CONDUCT.md).
          required: true
